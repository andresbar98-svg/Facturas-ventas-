<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F2A5C;--blue:#1D4ED8;--bg:#EEF2F8;--card:#fff;--line:#D5DDEA;--text:#16233B;--mute:#5B6B86;--ok:#0E7A55;--okbg:#DCF2E8;--warn:#9A4B00;--warnbg:#FCE9CF;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.top{background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;position:sticky;top:0;z-index:5}
.top b{font-size:1.1rem}
.link{background:none;border:0;color:#fff;font:inherit;padding:10px;cursor:pointer;text-decoration:underline}
h2{margin:8px 0 14px;font-size:1.4rem;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
input,textarea,select{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--text)}
input:focus,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;margin-top:12px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 1.05rem "Figtree",system-ui,sans-serif;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lista-v{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.lista-v .n{font-weight:700;color:var(--ink)}
.lista-v .s{color:var(--mute);font-size:.9rem}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-size:.85rem;font-weight:700}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.pend{background:var(--warnbg);color:var(--warn)}
.vacio{text-align:center;color:var(--mute);padding:28px 8px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#F8FAFD}
.item .fila{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;align-items:end}.item .fila.p2{grid-template-columns:1fr 52px}.mini{display:block;margin:8px 0 0!important;font-size:.85rem;font-weight:600;color:var(--mute)}.fila .mini{margin-top:0!important}.mini span{display:block}.mini input{margin-top:4px;font-weight:400;color:var(--text)}
.item .x{min-height:52px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:1.3rem;color:var(--bad);cursor:pointer}
.total-live{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:700;color:var(--ink);padding:10px 2px}
.abrow{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#F8FAFD}.abrow .fila{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* comprobante */
.recibo{--u:.34px;--nv:#0A1D72;position:relative;background:#fff;border-radius:calc(var(--u)*24);overflow:hidden;margin-bottom:6px;box-shadow:0 2px 14px rgba(15,42,92,.18);color:var(--nv);font-weight:700;line-height:1.15}

.rb-r .art{text-align:left;padding-left:calc(var(--u)*16)}
.rb-r .art b{display:block;font-size:calc(var(--u)*30);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-r .fe{text-align:left;padding-left:calc(var(--u)*30)}
.rb-r small{display:block;font-weight:500;color:#1A3A9A;font-size:calc(var(--u)*21);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-ov{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:nowrap;font-weight:800}
.rb-pill{background:linear-gradient(#04369A,#002182);color:#fff;border-radius:calc(var(--u)*25);font-size:calc(var(--u)*34)}
.rb-fecha{background:#fff;border-radius:calc(var(--u)*23);font-size:calc(var(--u)*31);color:var(--nv)}
.rb-cli{justify-content:space-between;padding:0 calc(var(--u)*14);font-size:calc(var(--u)*33);color:var(--nv);gap:calc(var(--u)*10)}
.rb-cli .n{overflow:hidden;text-overflow:ellipsis}.rb-cli .n small{display:inline;font-size:calc(var(--u)*22);margin-left:calc(var(--u)*8)}
.rb-cli .e{font-size:calc(var(--u)*22);color:#1A3A9A;flex:none}
.rb-val{font-size:calc(var(--u)*32);color:var(--nv)}
.rb-sal{font-size:calc(var(--u)*44);color:var(--nv)}
.rb-okband{position:absolute;display:flex;align-items:center;justify-content:space-between;border-radius:calc(var(--u)*26);border:calc(var(--u)*3) solid #0E7A55;background:linear-gradient(#1DB383,#0E7A55);color:#fff;font-size:calc(var(--u)*44);font-weight:800;padding-left:calc(var(--u)*50)}
.rb-okband .v{width:calc(var(--u)*348);height:calc(var(--u)*77);margin-right:calc(var(--u)*2);border-radius:calc(var(--u)*18);background:#DCF2E8;color:#0E7A55;display:flex;align-items:center;justify-content:center}
.rb-qr{position:absolute;background:#fff;padding:calc(var(--u)*3)}
#qr{width:100%;height:100%}#qr canvas,#qr img{width:100%!important;height:100%!important}
#publico{padding:0 0 16px}
.item .resumen{display:none;align-items:center;gap:8px}
.abrow .resumen{display:none;align-items:center;gap:8px}.abrow.plegado .editor{display:none}.abrow.plegado .resumen{display:flex}
.item.plegado .editor{display:none}.item.plegado .resumen{display:flex}
.resumen .rs-t{flex:1;min-width:0}
.resumen .rs-t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resumen .rs-t small{display:block;color:var(--mute);font-size:.85rem;font-weight:400;line-height:1.3}
.resumen .rs-s{white-space:nowrap;color:var(--ink);font-size:.95rem}
.icono{flex:none;width:46px;height:46px;padding:0;border:2px solid var(--line);background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icono.lapiz{color:var(--blue)}.icono.basura{color:var(--bad)}
.mini select{margin-top:4px;font-weight:400;color:var(--text)}
.rc-head{text-align:center;padding-bottom:14px;border-bottom:2px dashed var(--line)}
.rc-neg{font-size:1.35rem;font-weight:800;color:var(--ink)}
.rc-num{margin-top:8px;font-size:1.15rem;font-weight:700}
.rc-sub{color:var(--mute);font-size:.9rem}
.rc-bloque{padding:14px 0;border-bottom:2px dashed var(--line)}
.rc-tit{font-weight:700;color:var(--mute);font-size:.9rem;margin-bottom:6px}
.rc-item{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.rc-desc{font-weight:600}.rc-monto{font-weight:700;white-space:nowrap}

.rc-fila{display:flex;justify-content:space-between;padding:4px 0}

<script>
setTimeout(() => {

  if (m) m.textContent = "No se pudo cargar la app. Si usas Firebase, ábrela desde tu dirección en internet (Firebase Hosting): la vista previa del chat bloquea la conexión. Para probar sin Firebase, deja MODO_LOCAL = true.";

<script type="module">
/* ====== CONFIGURACIÓN ====== */
// true  = modo de PRUEBA sin Firebase (los datos se guardan solo en este navegador)
// false = usa Firebase (la app debe estar publicada en internet)
const MODO_LOCAL = true;

const firebaseConfig = {
  apiKey: "AIzaSyCRtkJacBks9rlDib_XPux2pFhfr75QCuw",
  authDomain: "registro-ventas-41b09.firebaseapp.com",
  projectId: "registro-ventas-41b09",
  storageBucket: "registro-ventas-41b09.firebasestorage.app",
  messagingSenderId: "331370994089",
  appId: "1:331370994089:web:0bf50898b67cec4fdf4cb8",
  measurementId: "G-PDQLY6Z663"
};
const NEGOCIO = { nombre: "Mi Negocio", telefono: "", logo: "", moneda: "COP", locale: "es-CO" };
const PUBLICO = new URLSearchParams(location.search).get("id");
const $ = s => document.querySelector(s);

/* ---------- Comprobante ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad4 = n => String(n).padStart(4, "0");
const round2 = n => Math.round(n * 100) / 100;
const subtotal = a => (a.libras > 0 ? a.libras : a.cantidad) * a.precio;
function detalleLinea(a) {
  if (a.precio == null) return (a.libras > 0 ? `${a.cantidad} u. - ${a.libras} lb` : `${a.cantidad} u.`) + " - precio por confirmar";
  return a.libras > 0 ? `${a.cantidad} u. - ${a.libras} lb x ${money(a.precio)} por lb` : `${a.cantidad} x ${money(a.precio)}`;
}
const num = v => { const n = parseFloat(String(v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const fmtNum = n => { if (n == null) return ""; const [e, d] = String(round2(n)).split("."); return e.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + (d ? "," + d : ""); };
function puntos(el) {
  const v = el.value.replace(/[^\d,]/g, ""), i = v.indexOf(",");
  let ent = i < 0 ? v : v.slice(0, i);
  const dec = i < 0 ? null : v.slice(i + 1).replace(/,/g, "").slice(0, 2);
  ent = ent.replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  el.value = dec === null ? ent : ent + "," + dec;
}
document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("money-in")) puntos(e.target); }, true);
const estaSaldada = v => v.confirmado !== false && v.saldo <= 0;
const hoyISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const fechaInput = x => new Date(x + "T12:00:00");
function recalcular(v, articulos) {
  v.articulos = articulos;
  v.total = round2(articulos.reduce((t, a) => t + (a.precio ? subtotal(a) : 0), 0));
  v.confirmado = articulos.every(a => a.precio !== null && a.precio !== undefined);
  v.saldo = round2(v.total - v.abonado);
  v.estado = estaSaldada(v) ? "saldado" : "pendiente";
  return v;
}
const money = n => new Intl.NumberFormat(NEGOCIO.locale, { style: "currency", currency: NEGOCIO.moneda, minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n || 0);
const fmtFecha = (d, hora) => {
  const x = d?.toDate ? d.toDate() : new Date(d);
  const mes = x.toLocaleString(NEGOCIO.locale, { month: "short" }).replace(".", "");
  let t = `${String(x.getDate()).padStart(2, "0")} de ${mes} de ${x.getFullYear()}`;
  if (hora) t += " " + x.toLocaleTimeString(NEGOCIO.locale, { hour: "2-digit", minute: "2-digit" });
  return t;
};

// HTML del comprobante: se dibuja sobre la plantilla (franjas de imagen); las tablas crecen con los registros
const U = n => `calc(var(--u)*${n})`;
const pos = (l, t, w, h) => `left:${U(l)};top:${U(t)};width:${U(w)};height:${U(h)}`;
// 1 registro: solo fila final | 2: primera + final | 3 o más: primera + centrales + final
function filasTabla(celdas, pre) {
  const n = celdas.length;
  return celdas.map((h, i) => `<div class="rb-r ${pre}-${n === 1 ? "last" : i === 0 ? "first" : i === n - 1 ? "last" : "mid"}">${h}</div>`).join("");
}

function reciboHTML(v, abonos, { publico = false } = {}) {
  const conf = v.confirmado !== false, saldado = estaSaldada(v);
  const articulos = filasTabla(v.articulos.map(a => `
      <div class="art"><b>${esc(a.descripcion)}</b><small>${esc(detalleLinea(a))}</small></div>
      <div>${a.cantidad}</div>
      <div>${a.precio == null ? "<small>Por confirmar</small>" : money(a.precio) + (a.libras > 0 ? "<small>por lb</small>" : "")}</div>
      <div>${a.precio == null ? "<small>Por confirmar</small>" : money(subtotal(a))}</div>`), "a");
  const pagos = filasTabla(abonos.length ? abonos.map(p => {
    const extra = [p.metodo, p.nota].filter(Boolean).map(esc).join(" - ");
    return `<div class="fe"><b>${fmtFecha(p.fecha)}</b>${extra ? `<small>${extra}</small>` : ""}</div><div>${money(p.monto)}</div>`;
  }) : ['<div class="fe"><small>Aún no hay abonos</small></div><div></div>'], "b");
  const corta = d => { const x = d?.toDate ? d.toDate() : new Date(d); return `${String(x.getDate()).padStart(2, "0")}/${String(x.getMonth() + 1).padStart(2, "0")}/${x.getFullYear()}`; };
  const entrega = v.entrega ? `<span class="e">Entrega ${corta(v.entrega)}</span>` : "";
  return `
    <div class="rb-band rb-top">
      <div class="rb-ov rb-pill" style="${pos(272, 142, 397, 51)}">Comprobante ${pad4(v.numero)}</div>
      <div class="rb-ov rb-fecha" style="${pos(330, 214, 338, 46)}">${fmtFecha(v.fecha)}</div>
      <div class="rb-ov rb-cli" style="${pos(345, 296, 565, 48)}"><span class="n">${esc(v.cliente.nombre)}</span>${entrega}</div>
    </div>
    ${articulos}
    <div class="rb-band rb-mid"></div>
    ${pagos}
    <div class="rb-band rb-bot">
      <div class="rb-ov rb-val" style="${pos(610, 16, 305, 52)}${conf ? "" : ";font-size:" + U(24)}">${conf ? money(v.total) : "Por confirmar"}</div>
      <div class="rb-ov rb-val" style="${pos(610, 89, 305, 51)}">${money(v.abonado)}</div>
      ${saldado
        ? `<div class="rb-ov" style="${pos(8, 146, 925, 104)};background:#fff;border-radius:${U(30)}"></div><div class="rb-okband" style="${pos(16, 154, 909, 88)}"><span>Saldado</span><div class="v">${money(0)}</div></div>`
        : `<div class="rb-ov rb-sal" style="${pos(572, 159, 348, 77)}${conf ? "" : ";font-size:" + U(30)}">${conf ? money(v.saldo) : "Por definir"}</div>`}
      <div class="rb-qr" style="${pos(66, 267, 205, 205)}"><div id="qr"></div></div>
    </div>`;
}
function dibujarQR(id) {
  const el = document.getElementById("qr");
  if (!el || typeof QRCode === "undefined") return;
  el.innerHTML = "";
  new QRCode(el, { text: `${location.origin}${location.pathname}?id=${id}`, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
}

/* ====== DATOS: modo local (sin Firebase) ====== */
let datos = null;
try { datos = JSON.parse(localStorage.getItem("cv_datos")); } catch {}
datos = datos || { ultimo: 0, ventas: {} };
const subs = new Set();
const avisar = () => subs.forEach(f => f());
const guardar = () => { try { localStorage.setItem("cv_datos", JSON.stringify(datos)); } catch {} avisar(); };
window.addEventListener("storage", e => { if (e.key === "cv_datos") { try { datos = JSON.parse(e.newValue) || datos; } catch {} avisar(); } });
const suscribir = f => { subs.add(f); f(); return () => subs.delete(f); };

const local = {
  onAuth: cb => cb({ local: true }),
  login: async () => {}, logout: async () => {},
  ventas: cb => suscribir(() => cb(Object.entries(datos.ventas).map(([id, v]) => ({ id, ...v })).sort((a, b) => b.numero - a.numero))),
  venta: (id, cb) => suscribir(() => cb(datos.ventas[id] ? { id, ...datos.ventas[id] } : null)),
  abonos: (id, cb) => suscribir(() => cb([...(datos.ventas[id]?.abonos || [])].sort((a, b) => (a.fecha < b.fecha ? -1 : 1)))),
  crear: async (id, v, abonos) => {
    const n = ++datos.ultimo, ab = round2(abonos.reduce((t, x) => t + x.monto, 0)), saldo = round2(v.total - ab);
    datos.ventas[id] = { ...v, entrega: v.entrega ? v.entrega.toISOString() : null, numero: n, abonado: ab, saldo,
      estado: v.confirmado && saldo <= 0 ? "saldado" : "pendiente", fecha: new Date().toISOString(),
      abonos: abonos.map(x => ({ monto: x.monto, fecha: x.fecha.toISOString(), nota: "", metodo: x.metodo })) };
    guardar(); return n;
  },
  abonar: async (id, monto, nota, fecha, metodo) => {
    const v = datos.ventas[id];
    if (v.confirmado !== false && monto > v.saldo + 0.001) throw new Error("exceso");
    v.abonado = round2(v.abonado + monto); v.saldo = round2(v.total - v.abonado);
    v.estado = estaSaldada(v) ? "saldado" : "pendiente";
    v.abonos.push({ monto, fecha: fecha.toISOString(), nota, metodo }); guardar();
  },
  precios: async (id, articulos) => { recalcular(datos.ventas[id], articulos); guardar(); },
  editar: async (id, d) => { const v = datos.ventas[id]; v.cliente = d.cliente; v.entrega = d.entrega ? d.entrega.toISOString() : null; recalcular(v, d.articulos); guardar(); },
  eliminar: async id => { delete datos.ventas[id]; guardar(); }
};

/* ====== DATOS: Firebase (solo se descarga si MODO_LOCAL = false) ====== */
async function crearFirebase() {
  const V = "https://www.gstatic.com/firebasejs/10.12.2/";
  const A = await import(V + "firebase-app.js"), F = await import(V + "firebase-firestore.js"), Au = await import(V + "firebase-auth.js");
  const app = A.initializeApp(firebaseConfig), db = F.getFirestore(app), auth = Au.getAuth(app);
  const { collection, doc, query, orderBy, limit, onSnapshot, runTransaction, writeBatch, getDocs } = F;
  return {
    onAuth: cb => Au.onAuthStateChanged(auth, cb),
    login: (e, p) => Au.signInWithEmailAndPassword(auth, e, p),
    logout: () => Au.signOut(auth),
    ventas: (cb, err) => onSnapshot(query(collection(db, "ventas"), orderBy("numero", "desc"), limit(500)), s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err),
    venta: (id, cb, err) => onSnapshot(doc(db, "ventas", id), s => cb(s.exists() ? { id: s.id, ...s.data() } : null), err),
    abonos: (id, cb) => onSnapshot(query(collection(db, "ventas", id, "abonos"), orderBy("fecha", "asc")), s => cb(s.docs.map(d => d.data()))),
    crear: (id, v, abonos) => runTransaction(db, async tx => {
      const cref = doc(db, "config", "contador"), c = await tx.get(cref);
      const n = (c.exists() ? c.data().ultimo : 0) + 1, ab = round2(abonos.reduce((t, x) => t + x.monto, 0)), saldo = round2(v.total - ab);
      tx.set(cref, { ultimo: n });
      tx.set(doc(db, "ventas", id), { ...v, numero: n, abonado: ab, saldo, estado: v.confirmado && saldo <= 0 ? "saldado" : "pendiente", fecha: new Date() });
      abonos.forEach(x => tx.set(doc(collection(db, "ventas", id, "abonos")), { monto: x.monto, fecha: x.fecha, nota: "", metodo: x.metodo }));
      return n;
    }),
    abonar: (id, monto, nota, fecha, metodo) => runTransaction(db, async tx => {
      const vref = doc(db, "ventas", id), v = (await tx.get(vref)).data();
      if (v.confirmado !== false && monto > v.saldo + 0.001) throw new Error("exceso");
      const abonado = round2(v.abonado + monto), saldo = round2(v.total - abonado);
      tx.update(vref, { abonado, saldo, estado: estaSaldada({ ...v, saldo }) ? "saldado" : "pendiente" });
      tx.set(doc(collection(db, "ventas", id, "abonos")), { monto, fecha, nota, metodo });
    }),
    precios: (id, articulos) => runTransaction(db, async tx => {
      const vref = doc(db, "ventas", id), v = recalcular((await tx.get(vref)).data(), articulos);
      tx.update(vref, { articulos: v.articulos, total: v.total, confirmado: v.confirmado, saldo: v.saldo, estado: v.estado });
    }),
    editar: (id, d) => runTransaction(db, async tx => {
      const vref = doc(db, "ventas", id), v = recalcular((await tx.get(vref)).data(), d.articulos);
      tx.update(vref, { cliente: d.cliente, entrega: d.entrega, articulos: v.articulos, total: v.total, confirmado: v.confirmado, saldo: v.saldo, estado: v.estado });
    }),
    eliminar: async id => {
      const b = writeBatch(db);
      (await getDocs(collection(db, "ventas", id, "abonos"))).forEach(d => b.delete(d.ref));
      b.delete(doc(db, "ventas", id)); await b.commit();
    }
  };
}

let API;
try { API = MODO_LOCAL ? local : await crearFirebase(); }
catch (err) { console.error(err); $("#cargandoMsg").textContent = "No se pudo conectar con Firebase: " + err.message; throw err; }

/* ====== PANEL DEL VENDEDOR ====== */
const VISTAS = ["vInicio", "vNueva", "vDetalle"];
const ro = new ResizeObserver(es => es.forEach(e => e.target.style.setProperty("--u", (e.contentRect.width / 941) + "px")));
ro.observe($("#comprobante")); ro.observe($("#recibo"));
let ventas = [], ventaActual = null, abonosActual = [], editandoId = null;
let unsubLista, unsubVenta, unsubAbonos;

function toast(msg, tipo = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + tipo; t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function vista(id) { VISTAS.forEach(v => $("#" + v).classList.toggle("hidden", v !== id)); window.scrollTo(0, 0); }
function cerrarDetalle() { unsubVenta?.(); unsubAbonos?.(); ventaActual = null; abonosActual = []; }

$("#negocio").textContent = NEGOCIO.nombre;
$("#logoTop").src = ICONOS.l96; $("#logoLogin").src = ICONOS.l96;
if (MODO_LOCAL) {
  $("#btnSalir").classList.add("hidden");
}
API.onAuth(u => {
  $("#cargando")?.remove();
  if (PUBLICO) return;
  $("#login").classList.toggle("hidden", !!u);
  $("#app").classList.toggle("hidden", !u);
  if (u) { cargarLista(); vista("vInicio"); } else { unsubLista?.(); cerrarDetalle(); }
});
$("#formLogin").onsubmit = async e => {
  e.preventDefault();
  try { await API.login($("#email").value, $("#pass").value); }
  catch { toast("Correo o contraseña incorrectos", "err"); }
};
$("#btnSalir").onclick = () => API.logout();

function cargarLista() {
  unsubLista?.();
  unsubLista = API.ventas(l => { ventas = l; pintarLista(); }, () => toast("No se pudieron cargar las ventas", "err"));
}
function pintarLista() {
  const q = $("#buscar").value.trim().toLowerCase();
  const l = ventas.filter(v => !q || pad4(v.numero).includes(q) || v.cliente.nombre.toLowerCase().includes(q));
  $("#lista").innerHTML = l.length ? l.map(v => `
    <button class="lista-v" data-id="${v.id}">
      <span><span class="n">${pad4(v.numero)} ${esc(v.cliente.nombre)}</span><br><span class="s">${fmtFecha(v.fecha)} - ${v.confirmado === false ? "Precio por confirmar" : "Total " + money(v.total)}</span></span>
      <span class="badge ${estaSaldada(v) ? "ok" : "pend"}">${estaSaldada(v) ? "Saldado" : v.confirmado === false ? "Por confirmar" : "Debe " + money(v.saldo)}</span>
    </button>`).join("")
    : `<p class="vacio">${ventas.length ? "No hay ventas con esa búsqueda." : "Aún no hay ventas. Toca “Nueva venta” para crear la primera."}</p>`;
}
$("#buscar").oninput = pintarLista;
$("#lista").onclick = e => { const b = e.target.closest(".lista-v"); if (b) abrirDetalle(b.dataset.id); };
document.querySelectorAll("[data-volver]").forEach(b => b.onclick = () => {
  if (editandoId) { const id = editandoId; editandoId = null; abrirDetalle(id); return; }
  cerrarDetalle(); vista("vInicio");
});

function addItem() {
  const d = document.createElement("div");
  d.className = "item";
  d.innerHTML = `<div class="editor">
    <input class="d" placeholder="Descripción (ej. Pollo)" aria-label="Descripción">
    <div class="fila">
      <label class="mini"><span>Cantidad</span><input class="c" type="number" inputmode="decimal" min="0" step="any" value="1"></label>
      <label class="mini"><span>Libras (opcional)</span><input class="l" type="number" inputmode="decimal" min="0" step="any" placeholder="Ej. 24"></label>
    </div>
    <div class="fila p2">
      <label class="mini"><span class="pl">Precio por unidad</span><input class="p money-in" type="text" inputmode="decimal" placeholder="Vacío si no lo sabes"></label>
      <button class="x" type="button" aria-label="Quitar artículo">×</button>
    </div>
    <div class="rc-sub sub" style="margin-top:8px"></div>
  </div><div class="resumen"></div>`;
  $("#items").appendChild(d);
}
const ICO_LAPIZ = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICO_BASURA = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
function plegar(r) {
  const nombre = r.querySelector(".d").value.trim();
  if (!nombre) return false;
  const c = +r.querySelector(".c").value || 0, lb = +r.querySelector(".l").value, pv = r.querySelector(".p").value;
  let det, sub;
  if (pv === "") { det = `${c} u.${lb > 0 ? " - " + lb + " lb" : ""} - precio por confirmar`; sub = "Por confirmar"; }
  else { const pr = num(pv); det = lb > 0 ? `${c} u. - ${lb} lb x ${money(pr)} por lb` : `${c} x ${money(pr)}`; sub = money(cantidadFila(r) * pr); }
  r.querySelector(".resumen").innerHTML = `<div class="rs-t"><b>${esc(nombre)}</b><small>${esc(det)}</small></div><b class="rs-s">${sub}</b>
    <button class="icono lapiz" type="button" aria-label="Editar artículo">${ICO_LAPIZ}</button>
    <button class="icono basura" type="button" aria-label="Eliminar artículo">${ICO_BASURA}</button>`;
  r.classList.add("plegado");
  return true;
}
function desplegar(r) {
  document.querySelectorAll(".item:not(.plegado)").forEach(o => { if (o !== r) plegar(o); });
  r.classList.remove("plegado"); r.querySelector(".d").focus();
}
function agregarArticulo() {
  const abierto = document.querySelector(".item:not(.plegado)");
  if (abierto && !plegar(abierto)) return toast("Escribe el nombre del artículo antes de agregar otro", "err");
  addItem(); pintarTotal();
  $("#items").lastElementChild.querySelector(".d").focus();
}
function leerAbonos() {
  return [...document.querySelectorAll(".abrow")].map(r => ({ monto: round2(num(r.querySelector(".am").value)), fecha: r.querySelector(".af").value ? fechaInput(r.querySelector(".af").value) : null, metodo: r.querySelector(".amet").value })).filter(x => x.monto > 0);
}
function addAbonoRow() {
  const d = document.createElement("div");
  d.className = "abrow";
  d.innerHTML = `<div class="editor">
    <div class="fila">
      <label class="mini"><span>Monto</span><input class="am money-in" type="text" inputmode="decimal" placeholder="Ej. 300.000"></label>
      <label class="mini"><span>Fecha</span><input class="af" type="date" max="${hoyISO()}" value="${hoyISO()}"></label>
    </div>
    <label class="mini" style="margin-top:8px!important"><span>Forma de pago</span><select class="amet"><option>Efectivo</option><option>Transferencia</option></select></label>
    <button class="btn okab" type="button" style="min-height:48px;margin-top:10px">Guardar abono</button>
    <button class="btn sec quitar" type="button" style="min-height:44px;margin-top:8px">Quitar este abono</button>
  </div><div class="resumen"></div>`;
  $("#abonosForm").appendChild(d);
  d.querySelector(".am").focus();
}
function plegarAb(r) {
  const monto = round2(num(r.querySelector(".am").value)), f = r.querySelector(".af").value;
  if (!(monto > 0)) { toast("Escribe el monto del abono", "err"); return false; }
  if (!f) { toast("Indica la fecha del abono", "err"); return false; }
  r.querySelector(".resumen").innerHTML = `<div class="rs-t"><b>${money(monto)}</b><small>${fmtFecha(fechaInput(f))} - ${esc(r.querySelector(".amet").value)}</small></div>
    <button class="icono lapiz" type="button" aria-label="Editar abono">${ICO_LAPIZ}</button>
    <button class="icono basura" type="button" aria-label="Eliminar abono">${ICO_BASURA}</button>`;
  r.classList.add("plegado");
  return true;
}
function desplegarAb(r) {
  document.querySelectorAll(".abrow:not(.plegado)").forEach(o => { if (o !== r) plegarAb(o); });
  r.classList.remove("plegado"); r.querySelector(".am").focus();
}
$("#btnAbonoForm").onclick = () => {
  const abierto = document.querySelector(".abrow:not(.plegado)");
  if (abierto && !plegarAb(abierto)) return;
  addAbonoRow(); pintarTotal();
};
$("#abonosForm").oninput = pintarTotal;
$("#abonosForm").onclick = e => {
  const r = e.target.closest(".abrow");
  if (!r) return;
  if (e.target.closest(".okab")) { plegarAb(r); return; }
  if (e.target.closest(".lapiz")) return desplegarAb(r);
  if (e.target.closest(".basura") || e.target.closest(".quitar")) { r.remove(); pintarTotal(); }
};
function cantidadFila(r) { const lb = +r.querySelector(".l").value; return lb > 0 ? lb : (+r.querySelector(".c").value || 0); }
function totalForm() {
  return round2([...document.querySelectorAll(".item")].reduce((t, r) => t + cantidadFila(r) * num(r.querySelector(".p").value), 0));
}
function pintarTotal() {
  let vacio = false;
  document.querySelectorAll(".item").forEach(r => {
    const lb = +r.querySelector(".l").value, pv = r.querySelector(".p").value;
    r.querySelector(".pl").textContent = lb > 0 ? "Precio por libra" : "Precio por unidad";
    if (pv === "") { vacio = true; r.querySelector(".sub").textContent = ""; }
    else r.querySelector(".sub").textContent = "Subtotal: " + money(cantidadFila(r) * num(pv)) + (lb > 0 ? ` (${lb} lb x ${money(num(pv))})` : "");
  });
  $("#totalLive").textContent = money(totalForm()) + (vacio ? " + por confirmar" : "");
  const ab = editandoId && ventaActual ? ventaActual.abonado : round2(leerAbonos().reduce((t, x) => t + x.monto, 0)), dif = round2(totalForm() - ab);
  $("#abonadoLive").textContent = money(ab);
  $("#saldoLabel").textContent = vacio ? "Saldo" : "Saldo pendiente";
  $("#saldoLive").textContent = vacio ? "Por definir" : dif < 0 ? money(0) + " (abonos mayores al total)" : money(dif);
}
$("#btnItem").onclick = agregarArticulo;
$("#items").oninput = pintarTotal;
$("#items").onclick = e => {
  const r = e.target.closest(".item");
  if (!r) return;
  if (e.target.closest(".lapiz")) return desplegar(r);
  if (e.target.closest(".basura") || e.target.closest(".x")) {
    if (e.target.closest(".x") && document.querySelectorAll(".item").length <= 1) return toast("La venta necesita al menos un artículo", "err");
    r.remove();
    if (!document.querySelector(".item")) addItem();
    pintarTotal();
  }
};
$("#btnNueva").onclick = () => {
  editandoId = null; $("#abonosControles").classList.remove("hidden");
  $("#tituloForm").textContent = "Nueva venta"; $("#btnGuardarVenta").textContent = "Guardar venta";
  $("#formVenta").reset(); $("#items").innerHTML = ""; $("#abonosForm").innerHTML = ""; addItem(); pintarTotal(); vista("vNueva"); };
const token = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");

$("#formVenta").onsubmit = async e => {
  e.preventDefault();
  const articulos = [...document.querySelectorAll(".item")].map(r => ({
    descripcion: r.querySelector(".d").value.trim(), cantidad: +r.querySelector(".c").value, libras: r.querySelector(".l").value === "" ? null : +r.querySelector(".l").value, precio: r.querySelector(".p").value === "" ? null : num(r.querySelector(".p").value)
  })).filter(a => a.descripcion);
  if (!articulos.length) return toast("Agrega al menos un artículo con descripción", "err");
  if (articulos.some(a => !(a.cantidad > 0) || (a.libras !== null && !(a.libras > 0)) || (a.precio !== null && !(a.precio >= 0)))) return toast("Revisa cantidades y precios", "err");
  const total = totalForm(), confirmado = articulos.every(a => a.precio !== null), abonosIni = leerAbonos();
  if (abonosIni.some(x => !x.fecha)) return toast("Indica la fecha de cada abono", "err");
  if (confirmado && round2(abonosIni.reduce((t, x) => t + x.monto, 0)) > total) return toast("Los abonos suman más que el total", "err");
  if (editandoId) {
    try {
      const id = editandoId;
      await API.editar(id, { cliente: { nombre: $("#cNombre").value.trim(), telefono: $("#cTel").value.trim() }, articulos, entrega: $("#cEntrega").value ? fechaInput($("#cEntrega").value) : null });
      editandoId = null; toast("Pedido actualizado"); abrirDetalle(id);
    } catch (err) { console.error(err); toast("No se pudieron guardar los cambios", "err"); }
    return;
  }
  const id = token();
  try {
    const numero = await API.crear(id, { cliente: { nombre: $("#cNombre").value.trim(), telefono: $("#cTel").value.trim() }, articulos, total, confirmado, entrega: $("#cEntrega").value ? fechaInput($("#cEntrega").value) : null }, abonosIni);
    toast(`Venta ${pad4(numero)} guardada`);
    abrirDetalle(id);
  } catch (err) { console.error(err); toast("No se pudo guardar la venta. Intenta de nuevo", "err"); }
};

function abrirDetalle(id) {
  cerrarDetalle(); vista("vDetalle");
  $("#comprobante").innerHTML = `<p class="vacio">Cargando…</p>`;
  unsubVenta = API.venta(id, v => {
    if (!v) { if (ventaActual) { cerrarDetalle(); vista("vInicio"); } return; }
    ventaActual = v; pintarDetalle();
  }, () => toast("No se pudo cargar el comprobante", "err"));
  unsubAbonos = API.abonos(id, a => { abonosActual = a; pintarDetalle(); });
}
function pintarDetalle() {
  if (!ventaActual) return;
  $("#comprobante").innerHTML = reciboHTML(ventaActual, abonosActual);
  dibujarQR(ventaActual.id);
  $("#btnAbono").disabled = estaSaldada(ventaActual);
}

$("#btnAbono").onclick = () => {
  $("#formAbono").reset();
  const conf = ventaActual.confirmado !== false;
  $("#saldoInfo").textContent = conf ? "Saldo pendiente: " + money(ventaActual.saldo) : "El precio aún no está confirmado: puedes registrar el abono igual.";
  if (conf) $("#aMonto").max = ventaActual.saldo; else $("#aMonto").removeAttribute("max");
  $("#aFecha").value = hoyISO(); $("#aFecha").max = hoyISO();
  $("#modal").classList.remove("hidden"); $("#aMonto").focus();
};
$("#aCancel").onclick = () => $("#modal").classList.add("hidden");
$("#formAbono").onsubmit = async e => {
  e.preventDefault();
  const monto = round2(num($("#aMonto").value)), nota = $("#aNota").value.trim();
  if (!(monto > 0)) return toast("Escribe un monto válido", "err");
  if (!$("#aFecha").value) return toast("Indica la fecha del abono", "err");
  try {
    await API.abonar(ventaActual.id, monto, nota, fechaInput($("#aFecha").value), $("#aMetodo").value);
    $("#modal").classList.add("hidden");
    toast("Abono guardado");
  } catch (err) {
    toast(err.message === "exceso" ? "El abono es mayor al saldo pendiente" : "No se pudo guardar el abono", "err");
  }
};

$("#btnEditar").onclick = () => {
  const v = ventaActual; editandoId = v.id;
  $("#formVenta").reset(); $("#items").innerHTML = ""; $("#abonosForm").innerHTML = "";
  $("#cNombre").value = v.cliente.nombre; $("#cTel").value = v.cliente.telefono || "";
  if (v.entrega) {
    const x = v.entrega.toDate ? v.entrega.toDate() : new Date(v.entrega);
    $("#cEntrega").value = `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  }
  v.articulos.forEach(a => {
    addItem(); const r = $("#items").lastElementChild;
    r.querySelector(".d").value = a.descripcion; r.querySelector(".c").value = a.cantidad;
    r.querySelector(".l").value = a.libras ?? ""; r.querySelector(".p").value = fmtNum(a.precio);
  });
  document.querySelectorAll(".item").forEach(plegar);
  $("#abonosControles").classList.add("hidden");
  $("#tituloForm").textContent = "Editar pedido " + pad4(v.numero); $("#btnGuardarVenta").textContent = "Guardar cambios";
  pintarTotal(); vista("vNueva");
};
$("#btnPrecios").onclick = () => {
  $("#preciosLista").innerHTML = ventaActual.articulos.map(a => `<div class="item"><b>${esc(a.descripcion)}</b> <span class="rc-sub">(${a.cantidad} u.)</span>
    <label class="mini"><span>Libras (opcional)</span><input class="lb" type="number" inputmode="decimal" min="0" step="any" value="${a.libras ?? ""}"></label>
    <label class="mini"><span>Precio (por libra si hay libras, si no por unidad)</span><input class="pr money-in" type="text" inputmode="decimal" value="${fmtNum(a.precio)}"></label></div>`).join("");
  $("#modalPrecios").classList.remove("hidden");
};
$("#pCancel").onclick = () => $("#modalPrecios").classList.add("hidden");
$("#formPrecios").onsubmit = async e => {
  e.preventDefault();
  const campos = [...document.querySelectorAll(".pr")], libs = [...document.querySelectorAll(".lb")];
  if (libs.some(x => x.value !== "" && !(+x.value > 0))) return toast("Revisa las libras", "err");
  const articulos = ventaActual.articulos.map((a, i) => ({ ...a, libras: libs[i].value === "" ? null : +libs[i].value, precio: campos[i].value === "" ? null : round2(num(campos[i].value)) }));
  try { await API.precios(ventaActual.id, articulos); $("#modalPrecios").classList.add("hidden"); toast("Precios guardados"); }
  catch (err) { console.error(err); toast("No se pudieron guardar los precios", "err"); }
};

$("#btnImg").onclick = async () => {
  if (typeof html2canvas === "undefined") return toast("No se pudo cargar el generador de imágenes", "err");
  try {
    const canvas = await html2canvas($("#comprobante"), { scale: 3, backgroundColor: "#ffffff" });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const nombre = `comprobante-${pad4(ventaActual.numero)}.png`;
    const file = new File([blob], nombre, { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: `Comprobante ${pad4(ventaActual.numero)}` }); }
      catch (err) { if (err.name !== "AbortError") throw err; }
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
      toast("Imagen descargada");
    }
  } catch (err) { console.error(err); toast("No se pudo generar la imagen", "err"); }
};

$("#btnDel").onclick = async () => {
  if (!confirm(`¿Eliminar la venta ${pad4(ventaActual.numero)}? Esta acción no se puede deshacer.`)) return;
  try { await API.eliminar(ventaActual.id); cerrarDetalle(); vista("vInicio"); toast("Venta eliminada"); }
  catch (err) { console.error(err); toast("No se pudo eliminar la venta", "err"); }
};

/* ====== VISTA PÚBLICA DEL CLIENTE (?id=CÓDIGO) ====== */
if (PUBLICO) {
  document.title = "Tu comprobante";
  const out = $("#recibo");
  $("#publico").classList.remove("hidden");
  const aviso = msg => { out.innerHTML = `<p class="vacio">${msg}</p>`; };
  let venta = null, abonos = [];
  const pintar = () => { if (venta) { out.innerHTML = reciboHTML(venta, abonos, { publico: true }); dibujarQR(PUBLICO); } };
  API.venta(PUBLICO, v => {
    venta = v;
    if (!v) return aviso("No encontramos este comprobante. Revisa que el código QR esté completo.");
    pintar();
  }, () => aviso("No pudimos cargar el comprobante. Revisa tu conexión e intenta de nuevo."));
  API.abonos(PUBLICO, a => { abonos = a; pintar(); });
}
</script>
</body>
</html>
